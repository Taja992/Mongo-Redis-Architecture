version: 2
updates:
  # NuGet for .NET backend (root directory)
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"  # Run on Mondays for predictability
    target-branch: "development"
    open-pull-requests-limit: 10
    groups:
      patch-updates:
        update-types:
          - "patch"
      minor-updates:
        update-types:
          - "minor"
      major-updates:
        update-types:
          - "major"
    ignore:
      - dependency-name: "*"  # Optional: Ignore specific packages
        update-types: ["version-update:semver-major"]
      - dependency-name: "Scalar.AspNetCore"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "AutoMapper"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # npm for Next.js frontend (web directory)
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "development"
    open-pull-requests-limit: 10
    groups:
      patch-updates:
        update-types:
          - "patch"
      minor-updates:
        update-types:
          - "minor"
      major-updates:
        update-types:
          - "major"
    ignore:
      - dependency-name: "next"  # Optional: Pin Next.js to 16.x if you want to control major bumps
        update-types: ["version-update:semver-major"]