services:
  mongo:
    image: mongo:latest
    container_name: mongoredisarchitecture_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongoredisarchitecture_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis/redis-stack-server:latest
    container_name: mongoredisarchitecture_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - mongoredisarchitecture_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      
volumes:
  mongoredisarchitecture_mongo_data:
  mongoredisarchitecture_redis_data:

name: mongoredisarchitecture
